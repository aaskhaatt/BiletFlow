# Runs the backend's end-to-end tests on every pull request and on main.
# A pull request can be merged only when this passes (see "Rules for two developers").
name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# a new push to the same pull request cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biletflow
        ports:
          - 5432:5432
        # wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # the same variables as backend/.env; this database only lives for this run, so the values aren't secret
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/biletflow
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # two branches that each added a migration on the same parent give two heads,
      # and "alembic upgrade head" then fails for everyone after merging
      - name: Check there is exactly one migration head
        run: |
          heads=$(alembic heads | grep -c "(head)")
          if [ "$heads" -ne 1 ]; then
            echo "::error::Found $heads Alembic heads. Pull main and regenerate your migration on top of the newest one."
            alembic heads
            exit 1
          fi

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run end-to-end tests
        run: python tests/run_all.py

      - name: Upload the test server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: backend/tests/e2e/server.log
          if-no-files-found: ignore
