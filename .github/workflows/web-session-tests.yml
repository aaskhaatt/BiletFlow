name: Web session tests

on:
  pull_request:
    paths:
      - 'web/**'
      - 'backend/**'
      - '.github/workflows/web-session-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biletflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biletflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/biletflow
      SECRET_KEY: ci-only-web-session-key-not-used-anywhere-else
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: '30'
      REFRESH_TOKEN_EXPIRE_DAYS: '7'
      SMTP_HOST: ''
      VITE_API_URL: http://127.0.0.1:8000
      BILETFLOW_E2E_LIVE_AUTH: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Prepare the test database and API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m alembic upgrade head

      - name: Install the web app and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser session tests
        working-directory: web
        run: |
          (cd ../backend && exec python -m uvicorn main:app --host 127.0.0.1 --port 8000) > "$RUNNER_TEMP/biletflow-web-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --max-time 4 --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health; then
            cat "$RUNNER_TEMP/biletflow-web-api.log"
            exit 1
          fi
          npm run e2e -- e2e/session.spec.ts e2e/session-lifecycle.spec.ts --workers=2
