# Render Blueprint for the shared test server: the API plus its own Postgres database.
# How to use it: docs/deploy.md. Render creates both services from this file and
# redeploys the API on every push to main.
services:
  - type: web
    name: biletflow-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biletflow-db
          property: connectionString
      # Render generates a random value once and keeps it
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"   # the same as locally
      # the hosted web app's address, filled in on the Render dashboard once it exists
      - key: CORS_ORIGINS
        sync: false
      # the same web app address, used in email links and Campaign QR links (https://...)
      - key: FRONTEND_URL
        sync: false
      # optional, filled in on the dashboard. Without SMTP_HOST emails wait in the outbox;
      # without S3_ENDPOINT_URL event image uploads answer 503 (e.g. Cloudflare R2's free tier works)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

databases:
  - name: biletflow-db
    plan: free
    region: frankfurt
    databaseName: biletflow
    user: biletflow
    postgresMajorVersion: "16"
