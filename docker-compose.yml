services:

  # S3-compatible file storage for event images (RustFS, a MinIO replacement: MinIO no longer publishes images).
  # Local development only: these keys must match S3_ACCESS_KEY / S3_SECRET_KEY in backend/.env.
  storage:
    image: rustfs/rustfs:1.0.6
    container_name: biletflow_storage
    environment:
      RUSTFS_ACCESS_KEY: biletflow
      RUSTFS_SECRET_KEY: biletflow-dev-secret
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data


  postgres:
    image: postgres:16
    container_name: biletflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biletflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./backend
    container_name: biletflow_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # inside Docker the database host is the "postgres" service, not localhost from backend/.env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/biletflow
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # the same for file storage: the API reaches it as "storage", browsers still at localhost:9000
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_URL: http://localhost:9000/biletflow-images
    depends_on:
      postgres:
        # start the API only when Postgres accepts connections; the API then applies migrations itself
        condition: service_healthy
      mailpit:
        condition: service_started
      storage:
        condition: service_started
    restart: unless-stopped


  # fake inbox for the demo: every email the API sends shows up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: biletflow_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  postgres_data:
  storage_data:
