services:

  # S3-compatible file storage for event images (RustFS, a MinIO replacement: MinIO no longer publishes images).
  # Local development only: these keys must match S3_ACCESS_KEY / S3_SECRET_KEY in backend/.env.
  storage:
    image: rustfs/rustfs:1.0.6
    container_name: biletflow_storage
    environment:
      RUSTFS_ACCESS_KEY: biletflow
      RUSTFS_SECRET_KEY: biletflow-dev-secret
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data


  postgres:
    image: postgres:16
    container_name: biletflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biletflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build:
      context: ./backend
    container_name: biletflow_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres


volumes:
  postgres_data:
  storage_data: