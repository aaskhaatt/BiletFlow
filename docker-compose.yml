services:

  postgres:
    image: postgres:16
    container_name: biletflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biletflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./backend
    container_name: biletflow_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # inside Docker the database host is the "postgres" service, not localhost from backend/.env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/biletflow
    depends_on:
      postgres:
        # start the API only when Postgres accepts connections; the API then applies migrations itself
        condition: service_healthy
    restart: unless-stopped


volumes:
  postgres_data:
